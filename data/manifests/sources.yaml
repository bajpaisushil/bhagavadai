# Source and licensing manifest. Enforced in code: see src/bhagavatam_ai/data/manifest.py.
#
# Rules:
# * Every entry cites evidence (URL + exact quote + date). "Publicly accessible", "free API" or
#   "on GitHub" is NOT a licence.
# * usage.training_text may only be true for public_domain / open_license / permission_granted.
# * excluded / permission_required entries may not list downloads or grant any usage.
# * Change an entry only with new evidence, and record it here.
version: 1
updated: 2026-11-18
policy: >-
  Training text must be verifiably public domain or licensed for ML training, model-weight
  distribution and a public demo. Bhaktivedanta Book Trust (BBT) translations and purports by
  A. C. Bhaktivedanta Swami Prabhupada are excluded unless written permission covering those uses is
  obtained. Non-expressive facts (verse numbering, chapter structure, speaker labels) may be derived from
  sources marked usage.metadata. Different translations are never mixed without source identification.

