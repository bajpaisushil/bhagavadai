# Canonical speaker names for Sanskrit speaker lines ("<name> uvāca").
#
# Keys are stems produced by bhagavatam_ai.data.normalize.speakers.speaker_key (sandhi and
# orthography removed). Entries marked `ambiguous: true` are generic labels whose referent depends on
# context (e.g. "rājā uvāca" is Parīkṣit in most chapters but King Rahūgaṇa in 5.10); the pipeline
# keeps the raw label and does not guess a name for them. `formula: true` marks verse-introduction
# formulae and mantras that appear in speaker position but are not speakers.
#
# Status: initial mapping derived from GRETIL speaker lines (1,332 attributions, 180 stems),
# 2026-11-18. Review before using speaker names in SFT data.
