name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly: also runs the real-model integration job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (tags can be moved).
# `python-version` on setup-uv exports UV_PYTHON, so every later uv command in the job uses the same
# interpreter; otherwise `uv run` would re-create the environment for .python-version (3.12).
# Tests run with `--no-sync` after an explicit, frozen `uv sync`.

jobs:
  quality:
    name: Lint, format, types, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra ml --extra dev --extra api
      - run: uv run --frozen --no-sync ruff check src tests
      - run: uv run --frozen --no-sync ruff format --check src tests
      - run: uv run --frozen --no-sync mypy
      - name: Validate the source/licence manifest
        run: uv run --frozen --no-sync bhagavatam data manifest

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen --extra ml --extra dev --extra api
      - name: Interpreter actually in use
        run: uv run --frozen --no-sync python -c "import sys, torch; print(sys.version, torch.__version__)"
      - run: uv run --frozen --no-sync pytest --cov --cov-report=term-missing

  web:
    name: Web UI (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  model-integration:
    name: Real-model integration (CPU)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/model.yaml') }}
      - run: uv sync --frozen --extra ml --extra dev --extra api
      - run: uv run --frozen --no-sync bhagavatam model download
      - run: uv run --frozen --no-sync pytest tests/integration --run-model -q
      - run: uv run --frozen --no-sync bhagavatam hardware check --config configs/hardware.cpu-smoke.yaml
