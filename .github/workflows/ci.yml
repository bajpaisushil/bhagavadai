name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # weekly: also runs the real-model integration job

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra ml --extra dev --python 3.12
      - run: uv run --frozen ruff check src tests
      - run: uv run --frozen ruff format --check src tests
      - run: uv run --frozen mypy
      - name: Validate the source/licence manifest
        run: uv run --frozen bhagavatam data manifest

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra ml --extra dev --python ${{ matrix.python }}
      - run: uv run --frozen pytest --cov --cov-report=term-missing

  model-integration:
    name: Real-model integration (CPU)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('configs/model.yaml') }}
      - run: uv sync --frozen --extra ml --extra dev --python 3.12
      - run: uv run --frozen bhagavatam model download
      - run: uv run --frozen pytest tests/integration --run-model -q
      - run: uv run --frozen bhagavatam hardware check --config configs/hardware.cpu-smoke.yaml
